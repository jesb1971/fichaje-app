<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Admin</title>

<style>
body {
    font-family: Arial;
    background: #f4f4f4;
    padding: 20px;
}

h1 {
    text-align: center;
}

/* filtros */
.filtros {
    margin-bottom: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

input, select {
    padding: 8px;
}

button {
    padding: 8px 12px;
    cursor: pointer;
}

/* tabla */
table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th, td {
    padding: 10px;
    border: 1px solid #ddd;
    text-align: center;
}

th {
    background: #333;
    color: white;
}

tr:nth-child(even) {
    background: #f9f9f9;
}

/* colores por empresa */
.ICADEPRO { background: #cfe2ff !important; }
.PROYECTOS { background: #d1e7dd !important; }
.PROICAFOR { background: #e2d9f3 !important; }
.GRUPO { background: #ffe5b4 !important; }

/* PDF */
@media print {
    .filtros, button, input, select {
        display: none !important;
    }

    th {
        background: #000 !important;
        color: white !important;
    }
}
</style>

</head>

<body style="margin:0;font-family:Arial,sans-serif;background:#f4f6f8;">

<div style="display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding-top:40px;">

<div style="width:95%;max-width:1200px;background:white;border-radius:10px;padding:25px;box-shadow:0 5px 20px rgba(0,0,0,0.1);">

<!-- HEADER -->
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">

    <h1 style="margin:0;">Registro de Jornada de los Trabajadores</h1>

    <button onclick="cerrarSesion()" 
        style="background:#e74c3c;color:white;border:none;padding:8px 12px;border-radius:5px;cursor:pointer;">
        Cerrar sesión
    </button>

</div>

<div class="filtros" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:15px;">

    <input type="date" id="fechaInicio">
    <input type="date" id="fechaFin">

    <select id="filtroEmpleado">
        <option value="">Todos los empleados</option>
    </select>

    <select id="filtroEmpresa">
        <option value="">Todas las empresas</option>
        <option value="ICADEPRO">ICADEPRO</option>
        <option value="Proyectos Empresariales Canarios">Proyectos Empresariales Canarios</option>
        <option value="PROICAFOR">PROICAFOR</option>
        <option value="GRUPO ICADEPRO">GRUPO ICADEPRO</option>
    </select>

    <button onclick="filtrar()">Filtrar</button>
    <button onclick="descargarExcel()">Descargar Excel</button>
    <button onclick="window.print()">Descargar PDF</button>

</div>

<div style="overflow-x:auto;">
<table style="width:100%;border-collapse:collapse;">

    <thead style="background:#333;color:white;">
        <tr>
            <th>Empleado</th>
            <th>Empresa</th>
            <th>Fecha</th>
            <th>Entrada</th>
            <th>Salida</th>
            <th>Horas</th>
            <th>Tipo</th>
            <th>IP</th>
        </tr>
    </thead>

    <tbody id="tabla"></tbody>

</table>
</div>

</div>
</div>

<script>

function cerrarSesion() {
    window.location.href = "/login_page";
}

</script>
</html>
