<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
}

/* contenedor centrado */
.contenedor {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* tarjeta */
.card {
    width: 100%;
    max-width: 400px;
    background: white;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    text-align: center;
}

/* logo */
.logo {
    width: 120px;
    margin-bottom: 15px;
}

/* título */
h1 {
    font-size: 20px;
    margin-bottom: 20px;
    color: #555;
}

/* inputs */
input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
}

/* botón */
button {
    padding: 10px 16px;
    background: #ff6a00;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    transition: 0.3s;
    width: auto; /* 🔥 CLAVE: evita botones gigantes */
}

.filtros {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
}

button:hover {
    background: #e65c00;
}

/* 🔧 Ajuste fino del panel */

.filtros {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
}

/* inputs más compactos */
.filtros input,
.filtros select {
    width: auto;
    min-width: 140px;
}

/* botones alineados */
.filtros button {
    width: auto;
}

/* separación del título */
h1 {
    margin-bottom: 20px;
}

/* mejora visual tabla */
table {
    font-size: 14px;
}

th {
    background: #2c3e50;
}

td {
    padding: 8px;
}

/* filas más suaves */
tr:nth-child(even) {
    background: #f8f9fa;
}

th {
	white-space: nowrap;
}

.activo {
	background-color: #e3f2fd;
	font-weight: bold;
}


</style>

</head>

<body style="margin:0;font-family:Arial,sans-serif;background:#f4f6f8;">

<div style="display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding-top:40px;">

<div style="width:95%;max-width:1200px;background:white;border-radius:10px;padding:25px;box-shadow:0 5px 20px rgba(0,0,0,0.1);">

<!-- HEADER -->
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">

    <h1 style="margin:0;">Registro de Jornada de los Trabajadores</h1>

    <button onclick="cerrarSesion()" 
        style="background:#e74c3c;color:white;border:none;padding:8px 12px;border-radius:5px;cursor:pointer;">
        Cerrar sesión
    </button>

</div>

<div class="filtros" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:15px;">

    <input type="date" id="fechaInicio">
    <input type="date" id="fechaFin">

    <select id="filtroEmpleado">
        <option value="">Todos los empleados</option>
    </select>

    <select id="filtroEmpresa">
        <option value="">Todas las empresas</option>
        <option value="ICADEPRO">ICADEPRO</option>
        <option value="Proyectos Empresariales Canarios">Proyectos Empresariales Canarios</option>
        <option value="PROICAFOR">PROICAFOR</option>
        <option value="GRUPO ICADEPRO">GRUPO ICADEPRO</option>
    </select>

    <button onclick="filtrar()">Filtrar</button>
    <button onclick="descargarExcel()">Descargar Excel</button>
    <button onclick="window.print()">Descargar PDF</button>

</div>

<div id="totalHoras" style="margin:10px 0;font-weight:bold;text-align:right;"></div>

<div style="overflow-x:auto;">
<table style="width:100%;border-collapse:collapse;">

    <thead style="background:#333;color:white;">
        <tr>
            <th>Empleado</th>
            <th>Empresa</th>
            <th>Fecha</th>
            <th>Entrada</th>
            <th>Salida</th>
			<th style="min-width:80px;">Pausa</th>
			<th style="min-width:120px;">Motivo</th>
            <th>Horas</th>
            <th>Tipo</th>
            <th>IP</th>
        </tr>
    </thead>

    <tbody id="tabla"></tbody>

</table>
</div>

</div>
</div>

<script>

let datosGlobales = [];

// 🔐 Cerrar sesión
function cerrarSesion() {
    window.location.href = "/login_page";
}

// 🚀 Cargar datos desde backend
function cargarDatos() {
    fetch("/ver_fichajes")
    .then(res => res.json())
    .then(data => {
        datosGlobales = data.fichajes;
        cargarSelect();
        pintarTabla(datosGlobales);
		calcularTotalHoras(datosGlobales);
    })
    .catch(error => {
        console.error("Error cargando datos:", error);
    });
}

// 🎯 Llenar select empleados
	function cargarSelect() {
    const select = document.getElementById("filtroEmpleado");
    select.innerHTML = '<option value="">Todos los empleados</option>';

    const nombres = [...new Set(datosGlobales.map(d => d.nombre))];

    nombres.forEach(nombre => {
        const option = document.createElement("option");
        option.value = nombre;
        option.textContent = nombre;
        select.appendChild(option);
    });
}

// 🧾 Pintar tabla
function pintarTabla(datos) {
    const tabla = document.getElementById("tabla");
    tabla.innerHTML = "";

    datos.forEach(f => {

        let clase = "";
        if (f.empresa.includes("ICADEPRO")) clase = "ICADEPRO";
        if (f.empresa.includes("Proyectos")) clase = "PROYECTOS";
        if (f.empresa.includes("PROICAFOR")) clase = "PROICAFOR";
        if (f.empresa.includes("GRUPO")) clase = "GRUPO";
		
		if (f.entrada && !f.salida) {
			clase = clase ? clase + " activo" : "activo";
		}

        let horas = "-";
        if (f.entrada && f.salida) {
            const h1 = new Date(`1970-01-01T${f.entrada}`);
            const h2 = new Date(`1970-01-01T${f.salida}`);
            const diff = (h2 - h1) / 1000;

            const h = Math.floor(diff / 3600);
            const m = Math.floor((diff % 3600) / 60);

            horas = `${h}h ${m}m`;
        }

        tabla.innerHTML += `
            <tr class="${clase}">
                <td>${f.nombre}</td>
                <td>${f.empresa}</td>
                <td>${f.fecha}</td>
                <td>${f.entrada || "-"}</td>
                <td>${f.salida || "-"}</td>
				<td>${
					f.pausa_inicio
					? (f.pausa_fin
						? calcularPausa(f.pausa_inicio, f.pausa_fin)
						: '<span style="color:#e67e22;font-weight:bold;">En pausa</span>')
					: "-"
				}</td>
				<td style="text-align:center;">${
					 f.motivo_pausa && f.motivo_pausa !== "-"
					 ? `<span style="
						background:#e9ecef;
						padding:4px 8px;
						border-radius:6px;
						font-size:12px;
						font-weight:bold;
					 ">${f.motivo_pausa}</span>`
					 : "-"
				}</td>
                <td>${horas}</td>
                <td style="color:${f.tipo === "remoto" ? "red" : "green"};font-weight:bold;">
                    ${f.tipo.toUpperCase()}
                </td>
                <td>${f.ip}</td>
            </tr>
        `;
    });
}

function calcularPausa(inicio, fin) {
    const [h1, m1] = inicio.split(":").map(Number);
    const [h2, m2] = fin.split(":").map(Number);

    const minutos = (h2 * 60 + m2) - (h1 * 60 + m1);

    const horas = Math.floor(minutos / 60);
    const mins = minutos % 60;

    return `${horas}h ${mins}m`;
}

function calcularTotalHoras(datos) {

    let totalMinutos = 0;
    let empleadosActivos = new Set();
    
    // 🔹 OBTENER ÚLTIMO REGISTRO DE CADA EMPLEADO
    const ultimos = {};

    datos.forEach(f => {
        if (!ultimos[f.empleado]) {
            ultimos[f.empleado] = f;
        }
    });
        
    // 🔹 CONTAR ACTIVOS (SOLO ÚLTIMO REGISTRO)
    Object.values(ultimos).forEach(f => {
        if (f.entrada && !f.salida) {
            empleadosActivos.add(f.empleado);
        }
    });
    
    // 🔹 SUMAR HORAS (TODOS LOS REGISTROS)
    datos.forEach(f => {
        if (f.entrada && f.salida) {
            const [h1, m1] = f.entrada.split(":").map(Number);
            const [h2, m2] = f.salida.split(":").map(Number);

            const inicio = h1 * 60 + m1;
            const fin = h2 * 60 + m2;

            totalMinutos += (fin - inicio);
        }
    });

    const horas = Math.floor(totalMinutos / 60);
    const minutos = totalMinutos % 60;

    document.getElementById("totalHoras").innerText =
        "Resumen → Total: " + horas + "h " + minutos + "m | Activos ahora: " + empleadosActivos.size;
}

// 🔎 Filtrar
function filtrar() {
    const inicio = document.getElementById("fechaInicio").value;
    const fin = document.getElementById("fechaFin").value;
    const empleado = document.getElementById("filtroEmpleado").value;
    const empresa = document.getElementById("filtroEmpresa").value;

    let filtrados = datosGlobales;

    if (inicio) {
        filtrados = filtrados.filter(f => f.fecha >= inicio);
    }

    if (fin) {
        filtrados = filtrados.filter(f => f.fecha <= fin);
    }

    if (empleado) {
        filtrados = filtrados.filter(f => f.nombre === empleado);
    }

    if (empresa) {
        filtrados = filtrados.filter(f => f.empresa === empresa);
    }

    pintarTabla(filtrados);
	calcularTotalHoras(filtrados);
}

// 📥 Excel
function descargarExcel() {

    const inicio = document.getElementById("fechaInicio").value;
    const fin = document.getElementById("fechaFin").value;
    const nombreSeleccionado = document.getElementById("filtroEmpleado").value;
    const empresa = document.getElementById("filtroEmpresa").value;

    // 🔥 convertir nombre → empleado_id
    let empleado_id = "";
    if (nombreSeleccionado) {
        const encontrado = datosGlobales.find(d => d.nombre === nombreSeleccionado);
        if (encontrado) {
            empleado_id = encontrado.empleado;
        }
    }

    let url = "/exportar_excel?";

    if (inicio) url += "fecha_inicio=" + inicio + "&";
    if (fin) url += "fecha_fin=" + fin + "&";
    if (empleado_id) url += "empleado_id=" + empleado_id + "&";
    if (empresa) url += "empresa=" + empresa + "&";

    window.location.href = url;
}

// 🚀 IMPORTANTE (ESTO ES LO QUE TE FALTABA)
document.addEventListener("DOMContentLoaded", function() {
    cargarDatos();
});

</script>

</script>
</html>
