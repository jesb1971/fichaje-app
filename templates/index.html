</select>

<input type="password" id="pin" placeholder="Introduce tu PIN">

<div id="resultado"></div>

<script>

// 🔥 AUTOCARGA DESDE QR
const params = new URLSearchParams(window.location.search);
const empleadoQR = params.get("empleado_id");
if (empleadoQR) {
    document.getElementById("empleado").value = empleadoQR;
}

// 🔥 FICHAR
async function fichar() {
    let empleado = document.getElementById("empleado").value;
    let pin = document.getElementById("pin").value;
    let resultado = document.getElementById("resultado");

    if (!empleado || !pin) {
        alert("Selecciona tu nombre y escribe tu PIN");
        return;
    }

    resultado.innerHTML = "";

	// 🔥 CONSULTAR ESTADO
	const resEstado = await fetch(`/estado?empleado_id=${empleado}`);
	const dataEstado = await resEstado.json();

	// ❌ YA COMPLETO → BLOQUEAR
	if (dataEstado.estado === "completo") {
		alert("Ya has fichado entrada y salida hoy");
		return;
	}

	// ⚠️ YA TIENE ENTRADA → CONFIRMAR SALIDA
	if (dataEstado.estado === "entrada_hecha") {
		const confirmar = confirm("Ya tienes una entrada registrada. ¿Seguro que deseas registrar la salida?");
		if (!confirmar) {
			return;
		}
	}

    fetch(`/fichar?empleado_id=${empleado}&pin=${pin}`)
    .then(res => res.json().then(data => ({ ok: res.ok, data })))
    .then(({ ok, data }) => {

        if (!ok) {
            throw data;
        }

        // 🔴 FUERA DE SEDE
        if (data.aviso) {
            resultado.innerHTML = `
                <div style="background:#ffe5e5;color:#b30000;padding:15px;border-radius:8px;">
                    ${data.mensaje} - ${data.hora}<br>
                    ${data.aviso}
                </div>`;
        } else {
            // 🟢 NORMAL
            resultado.innerHTML = `
                <div style="background:#e6ffe6;color:#006600;padding:15px;border-radius:8px;">
                    ${data.mensaje} - ${data.hora}
                </div>`;
        }

        // 🔄 SOLO LIMPIAR PIN (NO EMPLEADO)
        document.getElementById("pin").value = "";

        // 🔁 ACTUALIZAR ESTADO (BIEN UBICADO)
        if (typeof actualizarEstado === "function") {
            actualizarEstado();
        }

    })
    .catch(err => {

        console.error("ERROR:", err);

        resultado.innerHTML = `
            <div style="background:#fff3cd;color:#856404;padding:15px;border-radius:8px;">
                ${err.detail || "Error al fichar"}
            </div>`;
    });
}

</script>

</body>
