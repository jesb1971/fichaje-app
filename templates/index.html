<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fichaje</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background-color: #f4f4f4;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: white;
    padding: 30px;
    border-radius: 10px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

select, input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    margin-bottom: 15px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 15px;
    font-size: 18px;
    background-color: #f97316;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

#resultado {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
}
</style>

</head>

<body>

<div class="container">

<div style="text-align:center; margin-bottom:20px;">
    <img src="/static/logo.png" style="width:140px;">
    <p style="margin:5px 0 15px; color:#6b7280;">Control Horario</p>
</div>

<input type="password" id="pin" placeholder="Introduce tu PIN">

<div id="alertaConfirmacion" style="
    display:none;
    background:#ffe5e5;
    color:#b30000;
    padding:15px;
    border-radius:8px;
    margin-bottom:15px;
    font-weight:bold;
">
</div>

<button id="botonFichar" onclick="fichar()">FICHAR</button>

<select id="motivoPausa" style="margin-top:10px;">
    <option value="">Selecciona motivo de pausa</option>
    <option value="Trámites">Trámites</option>
    <option value="Gestión médica">Gestión médica</option>
    <option value="Otros">Otros</option>
</select>

<button onclick="pausa()" style="margin-top:10px;">PAUSA</button>

<button onclick="verMiReporte()" style="
    margin-top:10px;
    background:#f97316;
    color:white;
    padding:15px;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
">
    VER MI REGISTRO
</button>

<div id="resultado"></div>

</div>

<script>

// 🔥 FICHAR
async function fichar() {
    let pin = document.getElementById("pin").value;
    let resultado = document.getElementById("resultado");

    if (!pin) {
        alert("Introduce tu PIN");
        return;
    }

    resultado.innerHTML = "";

    let dataEstado;

    try {
        const resEstado = await fetch(`/estado?pin=${pin}`);

        if (!resEstado.ok) throw new Error();

        dataEstado = await resEstado.json();

    } catch {
        dataEstado = { estado: "sin_fichar" };
    }

    if (dataEstado.estado === "completo") {
        alert("Ya has fichado entrada y salida hoy");
        return;
    }

    if (dataEstado.estado === "entrada_hecha") {

    const alerta = document.getElementById("alertaConfirmacion");

    alerta.style.display = "block";
    alerta.innerHTML = `
        ⚠️ Ya tienes una entrada registrada.<br><br>
        <button onclick="confirmarSalida()" style="
            background:#b30000;
            color:white;
            padding:12px;
            border:none;
            border-radius:6px;
            width:100%;
            font-size:16px;
        ">
            CONFIRMAR SALIDA
        </button>
    `;

    return;
}

    fetch(`/fichar?pin=${pin}`)
    .then(res => res.json().then(data => ({ ok: res.ok, data })))
    .then(({ ok, data }) => {

        if (!ok) throw data;

        resultado.innerHTML = `
            <div style="background:#e6ffe6;color:#006600;padding:15px;border-radius:8px;">
                ${data.mensaje} - ${data.hora}
            </div>`;

        document.getElementById("pin").value = "";

    })
    .catch(() => {
        alert("Error al fichar");
    });
}

// 🔥 PAUSA
function pausa() {

    const pin = document.getElementById("pin").value;
    const motivo = document.getElementById("motivoPausa").value;

    if (!pin) {
        alert("Introduce tu PIN");
        return;
    }

    if (!motivo) {
        alert("Selecciona un motivo");
        return;
    }

    fetch(`/pausa?pin=${pin}&motivo=${encodeURIComponent(motivo)}`)
    .then(res => res.json())
    .then(data => {
        alert(data.mensaje + " - " + data.hora);
        document.getElementById("motivoPausa").value = "";
        document.getElementById("pin").value = "";
    })
    .catch(() => {
        alert("Error en pausa");
    });
}

function verMiReporte() {
    const pin = document.getElementById("pin").value;

    if (!pin) {
        alert("Introduce tu PIN");
        return;
    }

    window.open(`/mi_reporte?pin=${pin}`, "_blank");
}

</script>

</body>
</html>
