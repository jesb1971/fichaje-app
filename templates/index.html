<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fichaje</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background-color: #f4f4f4;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: white;
    padding: 30px;
    border-radius: 10px;

}

select, input {

    padding: 12px;
    font-size: 16px;
    margin-bottom: 15px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 15px;
    font-size: 18px;

    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

#accion {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

#resultado {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
}
</style>

</head>

<body>

<div class="container">

<div style="text-align:center; margin-bottom:20px;">
    <img src="/static/logo.png" style="width:140px;">
    <p style="margin:5px 0 15px; color:#6b7280;">Control Horario</p>
</div>

</select>

<input type="password" id="pin" placeholder="Introduce tu PIN">

<button id="botonFichar" onclick="fichar()">FICHAR</button>

<div id="resultado"></div>

</div>

<script>

// 🔥 AUTOCARGA DESDE QR
const params = new URLSearchParams(window.location.search);
const empleadoQR = params.get("empleado_id");
if (empleadoQR) {
    document.getElementById("empleado").value = empleadoQR;
}

// 🔥 FICHAR
function fichar() {
    let empleado = document.getElementById("empleado").value;
    let pin = document.getElementById("pin").value;
    let resultado = document.getElementById("resultado");

    if (!empleado || !pin) {
        alert("Selecciona tu nombre y escribe tu PIN");
        return;
    }

    resultado.innerHTML = ""; // limpiar

    fetch(`/fichar?empleado_id=${empleado}&pin=${pin}`)
    .then(async res => {
        let data = await res.json();

        if (!res.ok) throw data;

        return data;
    })
    .then(data => {

        // 🔴 FUERA DE SEDE
        if (data.aviso) {
            resultado.innerHTML = `
                <div style="background:#ffe5e5;color:#b30000;padding:15px;border-radius:8px;">
                    ${data.mensaje} - ${data.hora}<br>
                    ${data.aviso}
                </div>`;
        }

        // 🟢 NORMAL
        else {
            resultado.innerHTML = `
                <div style="background:#e6ffe6;color:#006600;padding:15px;border-radius:8px;">
                    ${data.mensaje} - ${data.hora}
                </div>`;
        }
		
		// 🔄 LIMPIAR CAMPOS
		document.getElementById("pin").value = "";
    })
    .catch(err => {

        resultado.innerHTML = `
            <div style="background:#fff3cd;color:#856404;padding:15px;border-radius:8px;">
                ${err.detail || "Error al fichar"}
            </div>`;
    });
}

                ${data.mensaje} - ${data.hora}<br>
                ${data.aviso}
            </div>`;
    }

    // 🟢 NORMAL

        resultado.innerHTML = `
            <div style="background:#e6ffe6;color:#006600;padding:15px;border-radius:8px;">
                ${data.mensaje} - ${data.hora}
            </div>`;
    }

    // 🔄 LIMPIAR SOLO PIN
    document.getElementById("pin").value = "";

    // 🔁 ACTUALIZAR ESTADO AUTOMÁTICO

</script>

</body>
</html>
