<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Fichaje</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background-color: #f4f4f4;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    background: white;
    padding: 30px;
    border-radius: 10px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

/* SELECT */
select, input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    margin-bottom: 15px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

/* BOTÓN */
button {
    width: 100%;
    padding: 15px;
    font-size: 18px;
    background-color: #f97316;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background-color: #ea580c;
}

/* TEXTO ACCIÓN */
#accion {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

/* RESULTADO */
#resultado {
    margin-top: 20px;
    font-size: 18px;
    font-weight: bold;
}
</style>

</head>

<body>

<div class="container">

<div style="text-align:center; margin-bottom:20px;">
    <img src="/static/logo.png" style="width:140px; margin-bottom:5px;">
    <p style="margin:5px 0 15px; color:#6b7280; font-size:16px; font-weight:500;">
        Control Horario
    </p>
</div>

<select id="empleado">
    <option value="">Selecciona tu nombre</option>

    <option value="pilar_ganuza">Pilar Ganuza</option>
    <option value="begona_bonis">Begoña de Bonis</option>
    <option value="maria_eugenia_lopez">Mª Eugenia López Baez</option>
    <option value="luichy_jorge">María Luisa Jorge cabrera</option>
    <option value="jose_sanchez">José Sánchez</option>
    <option value="javier_alfonso">Javier Alfonso</option>
    <option value="eduardo_rivero">Eduardo Rivero</option>
    <option value="nazaret_ramos">Nazaret Ramos</option>
    <option value="asuncion_olivares">Asunción Olivares</option>
    <option value="carla_martin">Carla Martín</option>
    <option value="cristo_diaz">Cristo Díaz Miranda</option>
    <option value="laura_perez">Laura Pérez Gómez</option>
    <option value="marta_cano">Marta Cano Oliva</option>
    <option value="soledad_fernandez">Soledad Fernández</option>
    <option value="candelaria_rodriguez">Candelaria Rodríguez</option>
    <option value="natalia_diaz">Natalia Díaz</option>
</select>

<!-- 🔐 PIN -->
<input type="password" id="pin" placeholder="Introduce tu PIN">

<p id="accion"></p>

<button id="botonFichar" onclick="fichar()">FICHAR</button>

<p id="resultado"></p>

</div>

<script>

// 🔥 AUTOCARGA DESDE QR
const params = new URLSearchParams(window.location.search);
const empleadoQR = params.get("empleado_id");

if (empleadoQR) {
    document.getElementById("empleado").value = empleadoQR;
}

// 🔄 ESTADO
function actualizarEstado() {
    let empleado = document.getElementById("empleado").value;

    if (!empleado) return;

    fetch("/estado?empleado_id=" + empleado)
    .then(res => res.json())
    .then(data => {

        let boton = document.getElementById("botonFichar");
        let accion = document.getElementById("accion");

        if (data.estado === "sin_fichar") {
            accion.innerText = "Vas a fichar ENTRADA";
            accion.style.color = "green";

            boton.innerText = "FICHAR";
            boton.style.backgroundColor = "#28a745";
            boton.disabled = false;
        }

        else if (data.estado === "entrada_hecha") {
            accion.innerText = "Vas a fichar SALIDA";
            accion.style.color = "blue";

            boton.innerText = "FICHAR";
            boton.style.backgroundColor = "#007bff";
            boton.disabled = false;
        }

        else if (data.estado === "completo") {
            accion.innerText = "Jornada completa";
            accion.style.color = "red";

            boton.innerText = "BLOQUEADO";
            boton.style.backgroundColor = "gray";
            boton.disabled = true;
        }

    });
}

// 🔥 FICHAR CON PIN
function fichar() {
    let empleado = document.getElementById("empleado").value;
    let pin = document.getElementById("pin").value;

    if (!empleado || !pin) {
        alert("Selecciona tu nombre y escribe tu PIN");
        return;
    }

    fetch(`/fichar?empleado_id=${empleado}&pin=${pin}`)
    .then(res => {
        if (!res.ok) throw new Error();
        return res.json();
    })
    .then(data => {

        let resultado = document.getElementById("resultado");

        resultado.innerText = data.mensaje + " - " + data.hora;

        if (data.mensaje.includes("Entrada")) {
            resultado.style.color = "green";
        } else if (data.mensaje.includes("Salida")) {
            resultado.style.color = "blue";
        }

        // 🔐 LIMPIAR PIN (AQUÍ ESTÁ LA MEJORA)
        document.getElementById("pin").value = "";

        actualizarEstado();
    })
    .catch(() => {
        alert("PIN incorrecto");

        // 🔐 LIMPIAR TAMBIÉN SI FALLA
        document.getElementById("pin").value = "";
    });
}

// EVENTO
document.getElementById("empleado").addEventListener("change", actualizarEstado);

// 🔄 AUTO ACTUALIZA SI VIENE DE QR
if (empleadoQR) {
    actualizarEstado();
}

</script>

</body>
</html>
