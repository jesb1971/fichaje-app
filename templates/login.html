<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login Admin</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
}

/* centrar pantalla */
.contenedor {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* tarjeta */
.card {
    width: 100%;
    max-width: 400px;
    background: white;
    border-radius: 12px;
    padding: 30px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    text-align: center;
}

/* logo */
.logo {
    width: 120px;
    margin-bottom: 15px;
}

/* título */
h2 {
    margin-bottom: 20px;
    color: #555;
}

/* inputs */
input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
}

/* botón */
button {
    width: 100%;
    padding: 14px;
    background: #ff6a00;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #e65c00;
}

/* error */
#error {
    color: red;
    margin-top: 10px;
}

</style>

</head>

<body>

<div class="contenedor">
    <div class="card">

        <!-- LOGO -->
        <img src="/static/logo.png" class="logo">

        <h2>Acceso Admin</h2>

        <input type="text" id="usuario" placeholder="Usuario">
        <input type="password" id="password" placeholder="Contraseña">

        <button onclick="login()">Entrar</button>

        <p id="error"></p>

    </div>
</div>

<script>
function login() {
    let user = document.getElementById("usuario").value;
    let pass = document.getElementById("password").value;

    fetch("/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            usuario: user,
            password: pass
        })
    })
    .then(res => res.json())
    .then(data => {

        if (data.ok) {
            window.location.href = "/admin?token=" + data.token;
        } else {
            document.getElementById("error").innerText = "Credenciales incorrectas";
        }

    });
}
</script>

</body>
</html>
